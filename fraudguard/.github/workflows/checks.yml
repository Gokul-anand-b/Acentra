name: Verify FraudGuard
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fraudguard
          POSTGRES_PASSWORD: ci-disposable-password
          POSTGRES_DB: fraudguard_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fraudguard -d fraudguard_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --frozen
      - run: uv run ruff check app tests
      - run: uv run pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://fraudguard:ci-disposable-password@localhost:5432/fraudguard_test
      - run: uv run alembic upgrade head && uv run alembic check
        env:
          DATABASE_URL: postgresql+psycopg://fraudguard:ci-disposable-password@localhost:5432/fraudguard_test
          JWT_SECRET: ci-only-secret-not-for-deployment-123456
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
