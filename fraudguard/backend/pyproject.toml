[project]
name = "fraudguard"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "PyJWT>=2.10,<3",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.20",
    "boto3>=1.35,<2",
    "networkx>=3.4,<4",
    "scikit-learn>=1.6,<2",
    "skops>=0.13,<1",
]
[dependency-groups]
dev = ["pytest>=8,<9", "httpx>=0.28,<1", "ruff>=0.11,<1"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]
